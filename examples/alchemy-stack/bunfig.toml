# Install releases at least seven days old, except the exact VibeLang, Effect, dprint (vibelang's formatter), Alchemy and test-tool pins.
# alchemy 2.0.0-beta.84 (2026-10-24) is the version the Alchemy migration used; it pins its @distilled.cloud SDKs exactly.
[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = ["vibelang", "dprint", "vibelang-runtime", "vibelang-vite", "vibelang-darwin-arm64", "vibelang-darwin-x64", "vibelang-linux-arm64", "vibelang-linux-x64", "@vibelang/cli-win32-arm64", "@vibelang/cli-win32-x64", "effect", "@effect/platform-bun", "@effect/platform-node", "@effect/platform-node-shared", "@effect/vitest", "vitest", "@vitest/mocker", "@vitest/spy", "alchemy", "@alchemy.run/cloudflare", "@alchemy.run/cloudflare-runtime", "@alchemy.run/acme", "@alchemy.run/docker", "@alchemy.run/node-utils", "@alchemy.run/sigil", "@alchemy.run/sql", "@distilled.cloud/core", "@distilled.cloud/aws4signer", "@distilled.cloud/cloudflare", "@distilled.cloud/iceberg", "@distilled.cloud/acme"]

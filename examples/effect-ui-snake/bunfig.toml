# Install releases at least seven days old, except the exact VibeLang, Effect, dprint (vibelang's formatter), OpenTUI, bundler-helper and test-tool pins.
[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = ["vibelang", "dprint", "vibelang-runtime", "vibelang-vite", "vibelang-darwin-arm64", "vibelang-darwin-x64", "vibelang-linux-arm64", "vibelang-linux-x64", "@smthrs/cli-win32-arm64", "@smthrs/cli-win32-x64", "effect", "@effect/platform-node", "@effect/platform-node-shared", "@effect/platform-browser", "@effect/vitest", "@effect/ai-anthropic", "@effect/ai-openai", "@effect/ai-openai-compat", "undici", "@opentui/core", "@opentui/core-linux-x64", "@opentui/core-linux-arm64", "@opentui/core-darwin-arm64", "@opentui/core-darwin-x64", "@opentui/core-win32-x64", "vite", "vitest", "@vitest/mocker", "@vitest/spy", "happy-dom", "magic-string", "@jridgewell/remapping"]

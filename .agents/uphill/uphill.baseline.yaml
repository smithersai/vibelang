    typescript/tsc/internal/vibelang: { baseline: 1628 }
    typescript/tsc/internal/vibelangestree: { baseline: 2300 }
    typescript/tsc/internal/vibelangfmt: { baseline: 1491 }
    typescript/tsc/internal/vibelangfuzz: { baseline: 1329 }

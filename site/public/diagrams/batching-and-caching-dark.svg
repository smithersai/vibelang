<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 315" role="img" aria-labelledby="t d">
  <title id="t">Request batching and TTL Cache</title>
  <desc id="d">Shows concurrent Request calls collapsed by a RequestResolver into a single batched backend query, with a Cache serving repeat lookups within TTL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#64708a"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#a5b4fc"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#fda4af"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#5eead4"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#fcd34d"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-size: 18px; font-weight: 700; fill: #eef1f6; }
    .sub { font-size: 13px; fill: #b3bac7; }
    .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .b { font-size: 14px; font-weight: 600; fill: #eef1f6; }
    .p { font-size: 12.5px; fill: #b3bac7; }
    .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 600; }
    .code-sm { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
  </style>
  <rect x="0" y="0" width="880" height="315" rx="10" fill="#14151a"/>
  
      <text x="36" y="42" class="h">Eliminate N+1 queries with RequestResolver batching and Cache</text>
      <text x="36" y="64" class="sub">Concurrent Effect requests automatically group into one batch; Cache deduplicates repeated lookups in memory.</text>

      <!-- Callers -->
      <rect x="36" y="94" width="176" height="46" rx="8" fill="#1c1d24" stroke="#6366f1" stroke-width="1.5"/>
      <text x="124" y="122" text-anchor="middle" class="code-sm" fill="#eef1f6">getUser(1)</text>
      <rect x="36" y="152" width="176" height="46" rx="8" fill="#1c1d24" stroke="#6366f1" stroke-width="1.5"/>
      <text x="124" y="180" text-anchor="middle" class="code-sm" fill="#eef1f6">getUser(2)</text>
      <rect x="36" y="210" width="176" height="46" rx="8" fill="#1c1d24" stroke="#6366f1" stroke-width="1.5"/>
      <text x="124" y="238" text-anchor="middle" class="code-sm" fill="#eef1f6">getUser(1)  (dup)</text>

      <!-- Arrows to Cache -->
      <line x1="212" y1="117" x2="274" y2="152" stroke="#a5b4fc" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>
      <line x1="212" y1="175" x2="274" y2="175" stroke="#a5b4fc" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>
      <line x1="212" y1="233" x2="274" y2="198" stroke="#5eead4" stroke-width="1.8" marker-end="url(#arrow-teal)"/>

      <!-- Cache / Dedupe -->
      <rect x="282" y="118" width="174" height="114" rx="10" fill="#133230" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="300" y="146" class="k" fill="#5eead4">CACHE &amp; DEDUPE</text>
      <text x="300" y="170" class="p">TTL + capacity bound</text>
      <text x="300" y="192" class="code-sm" fill="#5eead4">key 1 hit / shared</text>
      <text x="300" y="214" class="p">misses forward keys [1, 2]</text>

      <line x1="456" y1="175" x2="506" y2="175" stroke="#fcd34d" stroke-width="2" marker-end="url(#arrow-amber)"/>

      <!-- Batched Resolver -->
      <rect x="514" y="118" width="172" height="114" rx="10" fill="#382a14" stroke="#d97706" stroke-width="1.5"/>
      <text x="532" y="146" class="k" fill="#fcd34d">REQUESTRESOLVER</text>
      <text x="532" y="170" class="code-sm" fill="#eef1f6">makeBatched</text>
      <text x="532" y="192" class="p">1 round trip:</text>
      <text x="532" y="214" class="code-sm" fill="#fcd34d">WHERE id IN (1,2)</text>

      <line x1="686" y1="175" x2="726" y2="175" stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrow-indigo)"/>

      <!-- Backend -->
      <rect x="734" y="134" width="110" height="82" rx="10" fill="#1c1d24" stroke="#323544" stroke-width="1.5"/>
      <text x="789" y="168" text-anchor="middle" class="b">Database</text>
      <text x="789" y="190" text-anchor="middle" class="p">or HTTP API</text>

      <text x="440" y="290" text-anchor="middle" class="p">Run callers concurrently with <tspan class="code-sm" fill="#a5b4fc">try.all</tspan> or <tspan class="code-sm" fill="#a5b4fc">for concurrent</tspan> so Effect can batch them together.</text>
    
</svg>

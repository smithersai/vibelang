<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 315" role="img" aria-labelledby="t d">
  <title id="t">How VibeLang compiles alongside TypeScript in one program</title>
  <desc id="d">The vibelang compiler typechecks .vibe and .ts files together, emitting standard JavaScript and .d.vibe.ts declarations so TypeScript sees ordinary Effect functions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#92400e"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-size: 18px; font-weight: 700; fill: #16202e; }
    .sub { font-size: 13px; fill: #4b5563; }
    .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .b { font-size: 14px; font-weight: 600; fill: #16202e; }
    .p { font-size: 12.5px; fill: #4b5563; }
    .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 600; }
    .code-sm { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
  </style>
  <rect x="0" y="0" width="880" height="315" rx="10" fill="#f8fafc"/>
  
      <text x="36" y="42" class="h">One compiler, ordinary Effect output, zero ecosystem wall</text>
      <text x="36" y="64" class="sub">.vibe and .ts files live side by side, import each other, and compile to plain JavaScript + Effect declarations.</text>

      <!-- Source files -->
      <rect x="36" y="94" width="212" height="78" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="54" y="120" class="code" fill="#4338ca">app.vibe</text>
      <text x="54" y="142" class="p">effect functions, errors,</text>
      <text x="54" y="158" class="p">services, try, catch, match</text>

      <rect x="36" y="192" width="212" height="78" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="54" y="218" class="code" fill="#16202e">adapter.ts</text>
      <text x="54" y="240" class="p">npm SDKs, Promises, Node APIs</text>
      <text x="54" y="256" class="p">called via Effect.try / tryPromise</text>

      <!-- Arrows to compiler -->
      <line x1="248" y1="133" x2="314" y2="168" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>
      <line x1="248" y1="231" x2="314" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

      <!-- Compiler -->
      <rect x="322" y="126" width="224" height="112" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="434" y="156" text-anchor="middle" class="k" fill="#4338ca">COMPILER (TS 7 FORK)</text>
      <text x="434" y="182" text-anchor="middle" class="code" fill="#16202e">vibelang</text>
      <text x="434" y="206" text-anchor="middle" class="p">Checks .vibe + .ts together</text>
      <text x="434" y="224" text-anchor="middle" class="p">Tracks A, E, R &amp; @throws</text>

      <!-- Arrows to outputs -->
      <line x1="546" y1="162" x2="612" y2="133" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
      <line x1="546" y1="202" x2="612" y2="231" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>

      <!-- Outputs -->
      <rect x="620" y="94" width="224" height="78" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="638" y="120" class="code" fill="#0f766e">app.js + source maps</text>
      <text x="638" y="142" class="p">Standard Effect 4.1.1 code.</text>
      <text x="638" y="158" class="p">Runs on Node, Bun, Workers, Web.</text>

      <rect x="620" y="192" width="224" height="78" rx="10" fill="#ffffff" stroke="#d6dde8" stroke-width="1.5"/>
      <text x="638" y="218" class="code" fill="#4338ca">app.d.vibe.ts</text>
      <text x="638" y="240" class="p">Stock tsc sees ordinary</text>
      <text x="638" y="256" class="code-sm" fill="#4b5563">Effect.Effect&lt;A, E, R&gt;</text>

      <text x="440" y="298" text-anchor="middle" class="p">TypeScript calls VibeLang via <tspan class="code-sm" fill="#0f766e">await Effect.runPromise(fn())</tspan>; VibeLang calls TypeScript via <tspan class="code-sm" fill="#4338ca">Effect.try</tspan> / <tspan class="code-sm" fill="#4338ca">tryPromise</tspan>.</text>
    
</svg>

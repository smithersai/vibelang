<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="t d">
  <title id="t">Three outcomes of an Effect: Success, Expected Failure, and Defect / Interruption</title>
  <desc id="d">Expected failures travel on the typed E channel and are caught by catch. Defects and interruptions bypass catch and trigger cleanup finalizers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#64708a"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#a5b4fc"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#fda4af"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#5eead4"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#fcd34d"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-size: 18px; font-weight: 700; fill: #eef1f6; }
    .sub { font-size: 13px; fill: #b3bac7; }
    .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .b { font-size: 14px; font-weight: 600; fill: #eef1f6; }
    .p { font-size: 12.5px; fill: #b3bac7; }
    .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 600; }
    .code-sm { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
  </style>
  <rect x="0" y="0" width="880" height="340" rx="10" fill="#14151a"/>
  
      <text x="36" y="42" class="h">Expected errors vs. defects vs. interruption</text>
      <text x="36" y="64" class="sub">Only expected failures enter the type channel E and reach catch. Bugs (defects) and cancellation bypass catch — while still running cleanup.</text>

      <!-- Track 1: Success -->
      <rect x="36" y="88" width="808" height="66" rx="10" fill="#232445" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="52" y="108" width="126" height="26" rx="13" fill="#1c1d24" stroke="#6366f1" stroke-width="1.2"/>
   <text x="115" y="125" text-anchor="middle" class="k" fill="#a5b4fc">SUCCESS (A)</text>
      <text x="200" y="117" class="b">Normal return value</text>
      <text x="200" y="137" class="p"><tspan class="code-sm" fill="#a5b4fc">return value</tspan>  →  unwrapped by <tspan class="code-sm" fill="#a5b4fc">const x = try work()</tspan></text>
      <text x="720" y="126" text-anchor="middle" class="code-sm" fill="#a5b4fc">Tracked in A</text>

      <!-- Track 2: Expected failure -->
      <rect x="36" y="168" width="808" height="72" rx="10" fill="#3a1d24" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="52" y="191" width="126" height="26" rx="13" fill="#1c1d24" stroke="#e11d48" stroke-width="1.2"/>
   <text x="115" y="208" text-anchor="middle" class="k" fill="#fda4af">EXPECTED (E)</text>
      <text x="200" y="196" class="b">Recoverable domain failure</text>
      <text x="200" y="216" class="p"><tspan class="code-sm" fill="#fda4af">throw new NotFound({ id })</tspan>  →  caught &amp; narrowed by <tspan class="code-sm" fill="#fda4af">catch</tspan></text>
      <text x="200" y="232" class="p">Examples: missing record, bad input, network timeout, permission denied</text>
      <text x="720" y="208" text-anchor="middle" class="code-sm" fill="#fda4af">Tracked in E</text>

      <!-- Track 3: Defect / Interrupt -->
      <rect x="36" y="254" width="808" height="66" rx="10" fill="#382a14" stroke="#d97706" stroke-width="1.5"/>
      <rect x="52" y="274" width="126" height="26" rx="13" fill="#1c1d24" stroke="#d97706" stroke-width="1.2"/>
   <text x="115" y="291" text-anchor="middle" class="k" fill="#fcd34d">DEFECT / CANCEL</text>
      <text x="200" y="282" class="b">Broken invariant or fiber cancellation</text>
      <text x="200" y="302" class="p"><tspan class="code-sm" fill="#fcd34d">try die(err)</tspan>, null deref, <tspan class="code-sm" fill="#fcd34d">Fiber.interrupt</tspan>  →  bypasses <tspan class="code-sm" fill="#eef1f6">catch</tspan>, runs <tspan class="code-sm" fill="#fcd34d">ensuring</tspan> / <tspan class="code-sm" fill="#fcd34d">scoped</tspan></text>
      <text x="720" y="291" text-anchor="middle" class="code-sm" fill="#fcd34d">In Cause (not E)</text>
    
</svg>

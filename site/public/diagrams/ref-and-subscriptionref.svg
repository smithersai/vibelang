<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">Atomic Ref vs. reactive SubscriptionRef</title>
  <desc id="d">Shows Ref providing atomic compare-and-swap state updates across fibers, and SubscriptionRef extending Ref with a changes Stream for subscribers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#92400e"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-size: 18px; font-weight: 700; fill: #16202e; }
    .sub { font-size: 13px; fill: #4b5563; }
    .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .b { font-size: 14px; font-weight: 600; fill: #16202e; }
    .p { font-size: 12.5px; fill: #4b5563; }
    .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 600; }
    .code-sm { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
  </style>
  <rect x="0" y="0" width="880" height="300" rx="10" fill="#f8fafc"/>
  
      <text x="36" y="42" class="h">Share mutable state safely with Ref and SubscriptionRef</text>
      <text x="36" y="64" class="sub">Ref makes concurrent updates atomic. SubscriptionRef also streams every state change to listeners.</text>

      <!-- Left: Ref -->
      <rect x="36" y="88" width="386" height="184" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
      <rect x="54" y="104" width="152" height="24" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2"/>
   <text x="130" y="120" text-anchor="middle" class="k" fill="#4338ca">REF (ATOMIC CELL)</text>
      <rect x="54" y="144" width="104" height="48" rx="8" fill="#f1f5f9" stroke="#d6dde8" stroke-width="1.5"/>
      <text x="106" y="166" text-anchor="middle" class="code-sm" fill="#16202e">Ref.update</text>
      <text x="106" y="183" text-anchor="middle" class="p">n =&gt; n + 1</text>
      <line x1="158" y1="168" x2="202" y2="168" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow-indigo)"/>
      <rect x="208" y="142" width="92" height="52" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="254" y="164" text-anchor="middle" class="k" fill="#4338ca">STATE</text>
      <text x="254" y="184" text-anchor="middle" class="code" fill="#16202e">42 → 43</text>
      <line x1="300" y1="168" x2="330" y2="168" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
      <rect x="336" y="148" width="68" height="40" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="370" y="173" text-anchor="middle" class="code-sm" fill="#0f766e">get</text>
      <text x="54" y="226" class="p">Need an effectful update? Use <tspan class="code-sm" fill="#4338ca">SynchronizedRef</tspan>.</text>
      <text x="54" y="248" class="p">Zero race conditions across concurrent fibers.</text>

      <!-- Right: SubscriptionRef -->
      <rect x="444" y="88" width="400" height="184" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
      <rect x="462" y="104" width="212" height="24" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
   <text x="568" y="120" text-anchor="middle" class="k" fill="#0f766e">SUBSCRIPTIONREF (REACTIVE)</text>
      <rect x="462" y="142" width="96" height="52" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="510" y="164" text-anchor="middle" class="k" fill="#0f766e">CELL</text>
      <text x="510" y="184" text-anchor="middle" class="code-sm" fill="#16202e">v0 → v1</text>
      <line x1="558" y1="168" x2="604" y2="168" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
      <rect x="610" y="144" width="104" height="48" rx="8" fill="#f1f5f9" stroke="#5eead4" stroke-width="1.5"/>
      <text x="662" y="166" text-anchor="middle" class="code-sm" fill="#0f766e">ref.changes</text>
      <text x="662" y="183" text-anchor="middle" class="p">Stream&lt;A&gt;</text>
      <line x1="714" y1="158" x2="748" y2="148" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>
      <line x1="714" y1="178" x2="748" y2="188" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>
      <rect x="754" y="134" width="74" height="28" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="791" y="152" text-anchor="middle" class="code-sm" fill="#4338ca">UI view</text>
      <rect x="754" y="172" width="74" height="28" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="791" y="190" text-anchor="middle" class="code-sm" fill="#4338ca">Logger</text>
      <text x="462" y="226" class="p">New subscribers receive the current value first,</text>
      <text x="462" y="248" class="p">then every subsequent update in order.</text>
    
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">Scope lifecycle: resources acquire in order and release in reverse order</title>
  <desc id="d">Inside scoped(), acquiring File then Lock guarantees Lock releases before File, whether the body succeeds, fails, or is interrupted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#92400e"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-size: 18px; font-weight: 700; fill: #16202e; }
    .sub { font-size: 13px; fill: #4b5563; }
    .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .b { font-size: 14px; font-weight: 600; fill: #16202e; }
    .p { font-size: 12.5px; fill: #4b5563; }
    .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 600; }
    .code-sm { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
  </style>
  <rect x="0" y="0" width="880" height="300" rx="10" fill="#f8fafc"/>
  
      <text x="36" y="42" class="h">Guaranteed cleanup in reverse order (LIFO)</text>
      <text x="36" y="64" class="sub">acquireRelease binds each resource to the enclosing Scope. Even on error or cancellation, every acquired finalizer runs.</text>

      <!-- Outer scope frame -->
      <rect x="36" y="88" width="808" height="184" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
      <text x="56" y="114" class="code" fill="#0f766e">try scoped(effect { … })</text>

      <!-- Step 1 -->
      <rect x="56" y="134" width="140" height="88" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="126" y="160" text-anchor="middle" class="k" fill="#0f766e">1. ACQUIRE</text>
      <text x="126" y="184" text-anchor="middle" class="b">Open File</text>
      <text x="126" y="204" text-anchor="middle" class="p">uninterruptible</text>

      <line x1="196" y1="178" x2="220" y2="178" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

      <!-- Step 2 -->
      <rect x="228" y="134" width="140" height="88" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="298" y="160" text-anchor="middle" class="k" fill="#0f766e">2. ACQUIRE</text>
      <text x="298" y="184" text-anchor="middle" class="b">Take Lock</text>
      <text x="298" y="204" text-anchor="middle" class="p">uninterruptible</text>

      <line x1="368" y1="178" x2="392" y2="178" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

      <!-- Step 3 -->
      <rect x="400" y="134" width="126" height="88" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="463" y="160" text-anchor="middle" class="k" fill="#4338ca">3. USE</text>
      <text x="463" y="184" text-anchor="middle" class="b">Work</text>
      <text x="463" y="204" text-anchor="middle" class="p">ok / fail / cancel</text>

      <line x1="526" y1="178" x2="550" y2="178" stroke="#92400e" stroke-width="1.8" marker-end="url(#arrow-amber)"/>

      <!-- Step 4 -->
      <rect x="558" y="134" width="126" height="88" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
      <text x="621" y="160" text-anchor="middle" class="k" fill="#92400e">4. RELEASE</text>
      <text x="621" y="184" text-anchor="middle" class="b">Drop Lock</text>
      <text x="621" y="204" text-anchor="middle" class="p">runs first</text>

      <line x1="684" y1="178" x2="708" y2="178" stroke="#92400e" stroke-width="1.8" marker-end="url(#arrow-amber)"/>

      <!-- Step 5 -->
      <rect x="716" y="134" width="110" height="88" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
      <text x="771" y="160" text-anchor="middle" class="k" fill="#92400e">5. RELEASE</text>
      <text x="771" y="184" text-anchor="middle" class="b">Close File</text>
      <text x="771" y="204" text-anchor="middle" class="p">runs last</text>

      <text x="440" y="254" text-anchor="middle" class="p">If step 2 fails, step 5 still closes the file and step 4 is skipped because the lock was never acquired.</text>
    
</svg>

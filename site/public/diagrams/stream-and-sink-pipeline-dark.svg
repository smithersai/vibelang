<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">Pull-based Stream pipeline into a Sink</title>
  <desc id="d">Shows how chunks flow lazily from a Stream source through transform operators into a Sink, which folds them into a value and preserves unconsumed leftovers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#64708a"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#a5b4fc"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#fda4af"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#5eead4"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#fcd34d"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-size: 18px; font-weight: 700; fill: #eef1f6; }
    .sub { font-size: 13px; fill: #b3bac7; }
    .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .b { font-size: 14px; font-weight: 600; fill: #eef1f6; }
    .p { font-size: 12.5px; fill: #b3bac7; }
    .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 600; }
    .code-sm { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
  </style>
  <rect x="0" y="0" width="880" height="300" rx="10" fill="#14151a"/>
  
      <text x="36" y="42" class="h">Streams pull chunks lazily through operators into a Sink</text>
      <text x="36" y="64" class="sub">Nothing runs until a Sink or for-try loop demands chunks. Sinks return a result plus any unconsumed leftovers.</text>

      <!-- Source -->
      <rect x="36" y="98" width="174" height="96" rx="10" fill="#232445" stroke="#6366f1" stroke-width="1.5"/>
      <text x="54" y="124" class="k" fill="#a5b4fc">STREAM SOURCE</text>
      <text x="54" y="148" class="code-sm" fill="#eef1f6">Stream.fromIterable</text>
      <text x="54" y="168" class="code-sm" fill="#eef1f6">effect function* ()</text>
      <text x="54" y="186" class="p">emits Chunk&lt;A&gt;</text>

      <line x1="210" y1="146" x2="254" y2="146" stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrow-indigo)"/>

      <!-- Operators -->
      <rect x="262" y="98" width="224" height="96" rx="10" fill="#1c1d24" stroke="#323544" stroke-width="1.5"/>
      <text x="280" y="124" class="k" fill="#b3bac7">TRANSFORM OPERATORS</text>
      <text x="280" y="148" class="code-sm" fill="#eef1f6">Stream.filter(valid)</text>
      <text x="280" y="168" class="code-sm" fill="#eef1f6">Stream.mapEffect(enrich)</text>
      <text x="280" y="186" class="p">bounded memory &amp; backpressure</text>

      <line x1="486" y1="146" x2="530" y2="146" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow-teal)"/>

      <!-- Sink -->
      <rect x="538" y="98" width="152" height="96" rx="10" fill="#133230" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="556" y="124" class="k" fill="#5eead4">SINK&lt;A, In, L&gt;</text>
      <text x="556" y="148" class="code-sm" fill="#eef1f6">Sink.sum</text>
      <text x="556" y="168" class="code-sm" fill="#eef1f6">Sink.take(3)</text>
      <text x="556" y="186" class="p">folds &amp; stops early</text>

      <line x1="690" y1="130" x2="726" y2="130" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow-teal)"/>
      <line x1="690" y1="168" x2="726" y2="168" stroke="#fcd34d" stroke-width="2" marker-end="url(#arrow-amber)"/>

      <rect x="732" y="104" width="112" height="42" rx="8" fill="#133230" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="788" y="129" text-anchor="middle" class="code-sm" fill="#5eead4">Result A</text>

      <rect x="732" y="152" width="112" height="42" rx="8" fill="#382a14" stroke="#d97706" stroke-width="1.5"/>
      <text x="788" y="177" text-anchor="middle" class="code-sm" fill="#fcd34d">Leftover L</text>

      <rect x="36" y="218" width="808" height="52" rx="8" fill="#242630" stroke="#323544" stroke-width="1.5"/>
      <text x="440" y="249" text-anchor="middle" class="p">Run with <tspan class="code-sm" fill="#a5b4fc">try Stream.run(stream, sink)</tspan> or consume inline with <tspan class="code-sm" fill="#5eead4">for try (const item of stream) { ... }</tspan>.</text>
    
</svg>

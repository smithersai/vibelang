name: Pull request checks
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: vibelang/pr-check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: typescript/tsc/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: jj-cli@0.39.0
      - name: Enable Bubblewrap sandbox for confined checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: |
          (cd packages/runtime && bun install --frozen-lockfile && bun run build)
          sh scripts/ci.sh --prepare-only
          ln -sfn ../../../packages/runtime/dist .smithers/node_modules/vibelang-runtime/dist
      - name: Verify Smithers Cloud factory, wiki, audit, and auth contracts
        run: .smithers/node_modules/.bin/smthrs ci //.smithers:factory-suite --ui plain
        env:
          SMITHERS_CACHE_URL: ${{ secrets.SMITHERS_CACHE_URL }}
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
          SMITHERS_CACHE_NAMESPACE: pr-${{ github.event.pull_request.number }}
      - run: bun .smithers/flows/pr-check/run.ts
        env:
          SMITHERS_CACHE_URL: ${{ secrets.SMITHERS_CACHE_URL }}
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
          SMITHERS_CACHE_NAMESPACE: pr-${{ github.event.pull_request.number }}

name: Trusted Cache Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cache-publish-main
  cancel-in-progress: false

jobs:
  publish-cache:
    name: Populate shared Smithers Cloud object store (main only)
    if: >-
      github.event_name == 'push' &&
      github.repository == 'smithersai/vibelang' &&
      github.event.repository.default_branch != '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: cache-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: typescript/tsc/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository for tracked-leak and graph checks
        run: jj git init --colocate
      - name: Enable Bubblewrap sandbox for confined remote cache publication
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: sh scripts/ci.sh --prepare-only
      - name: Run and publish verified factory and docs targets to build.smithers.sh
        env:
          SMITHERS_CACHE_URL: ${{ secrets.SMITHERS_CACHE_URL }}
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
          SMITHERS_CACHE_WRITE_TOKEN: ${{ secrets.SMITHERS_CACHE_WRITE_TOKEN }}
        run: |
          .smithers/node_modules/.bin/smthrs ci //.smithers:factory-suite //:docs-check --ui plain
      - name: Run Uphill continuous metrics
        uses: wevm/uphill@main
        with:
          update: false
      - name: Publish Lighthouse Backpressure Audit and Obsidian Wiki feeds to smithers.sh
        env:
          SMITHERS_CACHE_URL: ${{ secrets.SMITHERS_CACHE_URL }}
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
          SMITHERS_CACHE_WRITE_TOKEN: ${{ secrets.SMITHERS_CACHE_WRITE_TOKEN }}
          SMITHERS_FEED_TOKEN: ${{ secrets.SMITHERS_FEED_TOKEN }}
        run: |
          bun scripts/audit/run-audit.ts --skip-uphill --publish
          bun .smithers/scripts/wiki.ts --publish
      - name: Upload Lighthouse Backpressure Audit report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-backpressure-audit-main
          path: |
            .uphill/lighthouse-audit.html
            .uphill/lighthouse-audit.json
            .uphill/lighthouse-audit.md
          retention-days: 30

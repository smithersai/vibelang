name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go gate materializes the pinned TypeScript fork from the vendored capsule
  # and builds the bridge into this directory. Caching it turns a cold ~5 minute
  # build into a few seconds when neither the pin nor the bridge sources changed.
  VIBELANG_TYPESCRIPT_FORK_CACHE: ${{ github.workspace }}/.fork-cache

jobs:
  gates:
    # The gates are run serially and in this order on purpose: the root suite
    # fails under concurrent load, `bun test` must run from poc/, and `npm test`
    # does not run the poc suite. See CONTRIBUTING.md §Running the gates.
    name: Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Optional foreign toolchains. Tests that need them are skipped or fail
      # closed when they are absent; installing them keeps CI equal to a
      # developer machine.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: dtolnay/rust-toolchain@stable

      - name: Restore the pinned fork build cache
        uses: actions/cache@v4
        with:
          path: .fork-cache
          key: fork-${{ runner.os }}-${{ hashFiles('typescript-fork.json', 'compiler/forkpatch/**', 'compiler/forkbridge/**', 'compiler/*.go', 'cmd/**') }}
          restore-keys: |
            fork-${{ runner.os }}-

      - name: Install dependencies
        run: |
          npm ci
          cd poc && bun install --frozen-lockfile

      - name: Brand gate
        run: node scripts/brand-gate.mjs

      - name: Check (build, type-check, Go gate)
        run: npm run check

      - name: Runtime suite (must run from poc/)
        working-directory: poc
        run: bun test

      - name: Root suite
        run: npm test

      - name: Conformance corpus on both backends
        run: node conformance/runner/run.mjs --backend both --jobs 4

      - name: Package verification
        run: npm run verify:pack

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build the documentation site
        working-directory: docs
        run: |
          npm ci
          npm run build

name: Uphill

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  uphill:
    name: Uphill Lighthouse Backpressure Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: typescript/tsc/go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Setup jj
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: jj-cli@0.39.0

      - name: Initialize colocated jj repo and install workspace dependencies
        run: |
          jj git init --colocate
          (cd packages/runtime && bun install --frozen-lockfile && bun run build)
          (cd docs/tools && bun install --frozen-lockfile)
          (cd .smithers && bun install --frozen-lockfile)
          ln -sfn ../../../packages/runtime/dist .smithers/node_modules/vibelang-runtime/dist

      - name: Run Uphill
        uses: wevm/uphill@main

      - name: Render Lighthouse Backpressure Audit Report
        env:
          SMITHERS_CACHE_URL: ${{ secrets.SMITHERS_CACHE_URL }}
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
        run: bun scripts/audit/run-audit.ts --skip-uphill

      - name: Upload Lighthouse Backpressure Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-backpressure-audit
          path: |
            .uphill/lighthouse-audit.html
            .uphill/lighthouse-audit.json
            .uphill/lighthouse-audit.md
            .uphill/report.html
            .uphill/report.json
          retention-days: 30
